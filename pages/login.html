<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071b10">
    <title>Iniciar sessão | VerdeVivo</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <main class="auth-screen">
        <div class="auth-overlay" aria-hidden="true"></div>

        <section class="auth-panel" aria-labelledby="login-title">
            <a class="auth-brand" href="../index.html" aria-label="VerdeVivo - página inicial">
                <svg viewBox="0 0 64 64" aria-hidden="true">
                    <path d="M32 54V30 M32 42C14 40 8 26 10 12 C25 12 35 22 32 42 M32 32C32 15 44 7 56 7 C57 25 47 35 32 39"
                          fill="none" stroke="currentColor" stroke-width="2.5"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>VerdeVivo</span>
            </a>

            <p class="auth-eyebrow">A tua horta, sempre contigo</p>
            <h1 id="login-title">Bem-vindo de volta</h1>
            <p class="auth-description">Inicia sessão para acompanhares as tuas plantas.</p>

            <form class="login-form" id="login-form">
                <label for="email">E-mail</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    placeholder="nome@exemplo.pt"
                    required>

                <label for="password">Palavra-passe</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Introduz a tua palavra-passe"
                    required>

                <button class="btn btn-primary login-submit" type="submit">Entrar</button>
                <p class="login-message" id="login-message" role="status" aria-live="polite"></p>
            </form>

            <p class="auth-switch">Ainda não tens conta? <a href="signup.html">Criar conta</a></p>
            <p class="auth-switch">Só queres explorar? <a href="menu.html">Pré-visualizar o menu</a></p>
            <a class="back-link" href="../index.html">← Voltar à página inicial</a>
        </section>
    </main>
    <script src="../assets/js/login.js"></script>
</body>
</html>
