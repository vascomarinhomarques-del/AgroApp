<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071b10">
    <title>Criar conta | VerdeVivo</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
    <main class="auth-screen">
        <div class="auth-overlay" aria-hidden="true"></div>

        <section class="auth-panel" aria-labelledby="signup-title">
            <a class="auth-brand" href="../index.html" aria-label="VerdeVivo - página inicial">
                <svg viewBox="0 0 64 64" aria-hidden="true">
                    <path d="M32 54V30 M32 42C14 40 8 26 10 12 C25 12 35 22 32 42 M32 32C32 15 44 7 56 7 C57 25 47 35 32 39"
                          fill="none" stroke="currentColor" stroke-width="2.5"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>VerdeVivo</span>
            </a>

            <p class="auth-eyebrow">Vamos fazer crescer</p>
            <h1 id="signup-title">Cria a tua conta</h1>
            <p class="auth-description">Regista-te para começares a cuidar das tuas plantas.</p>

            <form class="login-form" id="signup-form">
                <label for="name">Nome</label>
                <input
                    id="name"
                    name="name"
                    type="text"
                    autocomplete="name"
                    placeholder="O teu nome"
                    required>

                <label for="signup-email">E-mail</label>
                <input
                    id="signup-email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    placeholder="nome@exemplo.pt"
                    required>

                <label for="signup-password">Palavra-passe</label>
                <input
                    id="signup-password"
                    name="password"
                    type="password"
                    autocomplete="new-password"
                    minlength="8"
                    placeholder="Pelo menos 8 caracteres"
                    required>

                <label for="confirm-password">Confirma a palavra-passe</label>
                <input
                    id="confirm-password"
                    name="confirm-password"
                    type="password"
                    autocomplete="new-password"
                    placeholder="Repete a palavra-passe"
                    required>

                <button class="btn btn-primary login-submit" type="submit">Criar conta</button>
                <p class="login-message" id="signup-message" role="status" aria-live="polite"></p>
            </form>

            <p class="auth-switch">Já tens conta? <a href="login.html">Iniciar sessão</a></p>
            <p class="auth-switch">Só queres explorar? <a href="menu.html">Pré-visualizar o menu</a></p>
            <a class="back-link" href="../index.html">← Voltar à página inicial</a>
        </section>
    </main>
    <script src="../assets/js/signup.js"></script>
</body>
</html>
